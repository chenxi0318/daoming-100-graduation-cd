<script> 
$(function() {
	function getImgSize(imgSrc, width_height){
		var width = 600;
		var height = 450;
		var img_info = new Image(); 
		img_info.src = imgSrc; 
		var img_h = img_info.height; 
		var img_w = img_info.width; 
		
		
		if (img_info){
			var percent_w = width / img_w;
			var percent_h = height / img_h;
			var percent = "";
			
			if (percent_w <= percent_h)
				percent = percent_w;
			else
				percent = percent_h;
			
			
			if(img_w > width || img_h > height){
				width = img_w * percent;
				height = img_h * percent;
			}
		}
		
		if (width_height == "w")
			return width;
		else if (width_height == "h")
			return height;
	}

	$(".scrollable").scrollable({vertical: true, mousewheel: true});
	$(".items img[title]").tooltip();
	
	
	$(".items img").click(function() {
		// see if same thumb is being clicked
		if ($(this).hasClass("active")) { return; }
	 
		// calclulate large image's URL based on the thumbnail URL (flickr specific)
		var url = "../images/person/" + $(this).attr("id");
	 
		// get handle to element that wraps the image and make it semi-transparent
		var wrap = $("#image_wrap").fadeTo("medium", 0.5);
	 
		// the large image from www.flickr.com
		var img = new Image();
	 
	 
		// call this function after it's loaded
		img.onload = function() {
			// change the image
			wrap.find("img").attr("src", url);
			wrap.find("img").attr("width", getImgSize(url, "w"));
			wrap.find("img").attr("height", getImgSize(url, "h"));
			
			
			// make wrapper fully visible
			wrap.fadeTo("fast", 1);
		};
		
		wrap.find("a").attr("href", url);
		wrap.find("a").attr("rel", "clearbox");
		wrap.find("a").attr("title", "");
		// begin loading the image from big
		img.src = url;
	 
		// activate item
		$(".items img").removeClass("active");
		$(this).addClass("active");
	 
	// when page loads simulate a "click" on the first image
	}).filter(":first").click();
});
	
</script>
